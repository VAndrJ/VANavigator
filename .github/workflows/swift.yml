name: VANavigator

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: "Build and test"
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=iOS Simulator,OS=26.4.1,name=iPhone Air'
          - 'platform=iOS Simulator,OS=26.4.1,name=iPad Pro 13-inch (M4)'

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.4.1'
    - uses: actions/checkout@v7
    - name: Build and test
      run: |
        xcodebuild build test -project ./Example/VANavigator.xcodeproj -scheme VANavigator-Example -destination "${destination}"

    env:
      destination: ${{ matrix.destination }}

  library-evolution:
    name: "Release library evolution build"
    runs-on: macos-26

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.4.1'
    - uses: actions/checkout@v7
    - name: Build distributable library
      run: |
        xcodebuild build \
          -workspace ./.swiftpm/xcode/package.xcworkspace \
          -scheme VANavigator \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES

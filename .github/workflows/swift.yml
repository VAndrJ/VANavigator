name: VANavigator

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: "Build and test (${{ matrix.name }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 27.1 iPhone Duo
            runner: xcode-27
            xcode: '27.1'
            runtime: '27.1'
            scheme: VANavigator-Example
            destination: 'platform=iOS Simulator,OS=27.1,name=VANavigator Duo'
          - name: iOS 26.4.1 iPhone
            runner: macos-26
            xcode: '26.4.1'
            scheme: VANavigator-Example
            destination: 'platform=iOS Simulator,OS=26.4.1,name=iPhone Air'
          - name: iOS 26.4.1 iPad
            runner: macos-26
            xcode: '26.4.1'
            scheme: VANavigator-Example
            destination: 'platform=iOS Simulator,OS=26.4.1,name=iPad Pro 13-inch (M5)'
          - name: iOS 18.5 iPhone
            runner: macos-15
            xcode: '26.3'
            scheme: VANavigator-Example
            destination: 'platform=iOS Simulator,OS=18.5,name=iPhone 16'
          - name: iOS 18.5 iPad
            runner: macos-15
            xcode: '26.3'
            scheme: VANavigator-Example
            destination: 'platform=iOS Simulator,OS=18.5,name=iPad Pro 13-inch (M4)'

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}
    - uses: actions/checkout@v6
    - name: Prepare Duo simulator
      if: matrix.runtime == '27.1'
      run: |
        if ! xcrun simctl list runtimes --json | python3 -c 'import json, sys; sys.exit(not any(r["identifier"] == "com.apple.CoreSimulator.SimRuntime.iOS-27-1" and r["isAvailable"] for r in json.load(sys.stdin)["runtimes"]))'; then
          xcodebuild -downloadPlatform iOS -buildVersion 27.1 -architectureVariant arm64
        fi
        xcrun simctl create 'VANavigator Duo' \
          com.apple.CoreSimulator.SimDeviceType.iPhone-Duo \
          com.apple.CoreSimulator.SimRuntime.iOS-27-1
    - name: Build and test
      env:
        destination: ${{ matrix.destination }}
        scheme: ${{ matrix.scheme }}
      run: |
        xcodebuild \
          -project ./Example/VANavigator.xcodeproj \
          -scheme "${scheme}" \
          -destination "${destination}" \
          -onlyUsePackageVersionsFromResolvedFile \
          -skipMacroValidation \
          build test

  release-package:
    name: "Release package build"
    runs-on: macos-26
    timeout-minutes: 20

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.4.1'
    - uses: actions/checkout@v6
    - name: Build release package
      run: |
        xcodebuild \
          -scheme VANavigator \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
          build

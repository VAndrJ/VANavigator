name: VANavigator

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: "Build and test (${{ matrix.name }})"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.4.1 iPhone
            runner: macos-26
            xcode: '26.4.1'
            runtime: ''
            destination: 'platform=iOS Simulator,OS=26.4.1,name=iPhone Air'
          - name: iOS 26.4.1 iPad
            runner: macos-26
            xcode: '26.4.1'
            runtime: ''
            destination: 'platform=iOS Simulator,OS=26.4.1,name=iPad Pro 13-inch (M4)'
          - name: iOS 18.5 iPhone
            runner: macos-15
            xcode: '26.3'
            runtime: ''
            destination: 'platform=iOS Simulator,OS=18.5,name=iPhone 16'
          - name: iOS 18.5 iPad
            runner: macos-15
            xcode: '26.3'
            runtime: ''
            destination: 'platform=iOS Simulator,OS=18.5,name=iPad Pro 13-inch (M4)'
          - name: iOS 17.5 iPhone
            runner: macos-15
            xcode: '26.3'
            runtime: '17.5'
            destination: 'platform=iOS Simulator,OS=17.5,name=iPhone 15'
          - name: iOS 17.5 iPad
            runner: macos-15
            xcode: '26.3'
            runtime: '17.5'
            destination: 'platform=iOS Simulator,OS=17.5,name=iPad Pro 13-inch (M4)'

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}
    - name: Install simulator runtime
      if: matrix.runtime != ''
      env:
        runtime: ${{ matrix.runtime }}
      run: |
        xcrun simctl list > /dev/null
        xcodebuild -downloadPlatform iOS -buildVersion "${runtime}"
    - uses: actions/checkout@v7
    - name: Build and test
      run: |
        xcodebuild build test -project ./Example/VANavigator.xcodeproj -scheme VANavigator-Example -destination "${destination}"

    env:
      destination: ${{ matrix.destination }}

  library-evolution:
    name: "Release package build"
    runs-on: macos-26

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.4.1'
    - uses: actions/checkout@v7
    - name: Build release package
      run: |
        xcodebuild build \
          -workspace ./.swiftpm/xcode/package.xcworkspace \
          -scheme VANavigator \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          BUILD_LIBRARY_FOR_DISTRIBUTION=NO

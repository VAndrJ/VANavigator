name: VANavigator

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  build:
    name: "Build and test"
    runs-on: macos-26
    
    
    strategy:
      matrix:
        destination: ['platform=iOS Simulator,OS=26.4.1,name=iPhone Air']

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.4.1'
    - uses: actions/checkout@v7
    - name: Build and test
      run: |
        xcodebuild build test -project ./Example/VANavigator.xcodeproj -scheme VANavigator-Example -destination "${destination}"
    
    env:
      destination: ${{ matrix.destination }}
